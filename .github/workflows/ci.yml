name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  rust:
    name: Lint and Test (stable, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - complex
          - stream
          - complex,stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Ensure components present
        run: |
          rustup component add clippy rustfmt || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check (build all targets)
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --all-targets --features "${{ matrix.features }}"
          else
            cargo check --all-targets
          fi

      - name: Test
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --features "${{ matrix.features }}"
          else
            cargo test
          fi

# Note: OpenCL-related tests are not run in CI by default.
# They require GPU drivers and an OpenCL ICD on the runner.
